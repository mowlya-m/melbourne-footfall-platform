name: CD

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never cancel a running apply

# id-token is what allows the OIDC handshake. Without it the role assumption
# fails with an opaque STS error.
permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"
  AWS_REGION: ap-southeast-2

jobs:
  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-dev-${{ github.run_id }}

      - name: Verify assumed identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: infra/envs/dev
        run: terraform init

      - name: Terraform plan
        working-directory: infra/envs/dev
        run: terraform plan -out=tfplan -input=false

      - name: Terraform apply
        working-directory: infra/envs/dev
        run: terraform apply -auto-approve -input=false tfplan

      - name: Outputs
        working-directory: infra/envs/dev
        run: terraform output
